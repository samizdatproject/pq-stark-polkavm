[package]
name = "host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
air = { path = "../air" }
winter-air.workspace = true
winter-prover = { workspace = true, features = ["std"] }
winter-verifier = { workspace = true, features = ["std"] }
# Same polkavm as pallet-revive 0.18 (Kusama Asset Hub runtime v2.3.2) for execution;
# same linker version as pallet-revive-fixtures for building blobs.
polkavm = "=0.33.1"
polkavm-linker = "=0.30.0"
sha3 = "0.10"
